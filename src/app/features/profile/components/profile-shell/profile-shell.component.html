<!-- profile-shell.component.html -->
<app-navbar></app-navbar>

<main class="page-content">
  <div class="profile-page">
    <div class="container">
      <div class="profile-layout">

        <!-- LEFT SIDEBAR (Desktop) -->
        <aside class="profile-sidebar">

          <!-- User Info -->
          <div class="psidebar__user">
            <div class="psidebar__avatar">
              {{ avatarInitial }}
            </div>
            <div>
              <p class="psidebar__name">Hi, {{ displayGreeting }}</p>
              <p class="psidebar__phone">Customer</p>
            </div>
          </div>

          <!-- Nav -->
          <nav class="psidebar__nav">
            <a routerLink="info"
               routerLinkActive="active"
               class="psidebar__item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              My Profile
            </a>

            <a routerLink="orders"
               routerLinkActive="active"
               class="psidebar__item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
              My Orders
            </a>

            <a routerLink="addresses"
               routerLinkActive="active"
               class="psidebar__item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              My Addresses
            </a>

            <a routerLink="settings"
               routerLinkActive="active"
               class="psidebar__item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0
                         0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
                         1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65
                         1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
                         a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68
                         15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65
                         1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                         a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68
                         1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65
                         1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06
                         a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4
                         9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65
                         1.65 0 0 0-1.51 1z"/>
              </svg>
              Settings
            </a>
          </nav>

        </aside>

        <!-- RIGHT CONTENT -->
        <div class="profile-content">
          <router-outlet></router-outlet>
        </div>

      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
