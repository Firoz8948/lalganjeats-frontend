<section
  class="subcat-grid"
  [class.subcat-grid--dummy]="store.usingDummies()"
  aria-label="Food categories">
  <div class="subcat-grid__inner">
    @for (item of store.items(); track trackById($index, item); let i = $index) {
      @if (store.usingDummies()) {
        <div
          class="subcat-tile subcat-tile--inert"
          [style.--i]="i"
          aria-disabled="true">
          <span class="subcat-tile__circle" aria-hidden="true">
            <span class="subcat-tile__fallback">{{ initials(item.name) }}</span>
          </span>
          <span class="subcat-tile__label">{{ item.name }}</span>
        </div>
      } @else {
        <a
          class="subcat-tile"
          [style.--i]="i"
          routerLink="/restaurants"
          [queryParams]="{ subcategory_id: item.id, name: item.name }">
          <span class="subcat-tile__circle" aria-hidden="true">
            @if (item.image_url) {
              <img [src]="item.image_url" [alt]="" loading="lazy" decoding="async" />
            } @else {
              <span class="subcat-tile__fallback">{{ initials(item.name) }}</span>
            }
          </span>
          <span class="subcat-tile__label">{{ item.name }}</span>
        </a>
      }
    }
  </div>
</section>
