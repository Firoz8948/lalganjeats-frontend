@if (items().length) {
  <section class="subcategory-strip" aria-label="Explore food categories">
    <div class="container subcategory-strip__layout">
      <button
        class="subcategory-strip__arrow subcategory-strip__arrow--left"
        type="button"
        aria-label="Show previous categories"
        (click)="scroll(-1)">‹</button>

      <div class="subcategory-strip__scroller" #scroller>
        @for (item of items(); track item.id) {
          <a
            class="subcategory-pill"
            routerLink="/restaurants"
            [queryParams]="{ subcategory_id: item.id, name: item.name }">
            <strong>{{ item.name }}</strong>
            <span>
              {{ item.restaurant_count }}
              {{ item.restaurant_count === 1 ? 'restaurant' : 'restaurants' }}
            </span>
          </a>
        }
      </div>

      <button
        class="subcategory-strip__arrow subcategory-strip__arrow--right"
        type="button"
        aria-label="Show more categories"
        (click)="scroll(1)">›</button>
    </div>
  </section>
}
