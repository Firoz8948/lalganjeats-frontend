<section
  class="subcat-grid"
  [class.subcat-grid--dummy]="usingDummies()"
  [attr.aria-label]="ariaLabel()">
  <div class="subcat-grid__inner">
    @for (item of items(); track trackById($index, item); let i = $index) {
      @if (usingDummies()) {
        <div
          class="subcat-tile subcat-tile--inert"
          [style.--i]="i"
          aria-disabled="true">
          <span class="subcat-tile__circle" aria-hidden="true">
            <span class="subcat-tile__fallback">{{ initials(item.name) }}</span>
          </span>
          <span class="subcat-tile__label">{{ item.name }}</span>
        </div>
      } @else {
        @let target = link(item);
        <a
          class="subcat-tile"
          [style.--i]="i"
          [routerLink]="target.commands"
          [queryParams]="target.queryParams">
          <span class="subcat-tile__circle" aria-hidden="true">
            @if (item.image_url) {
              <img [src]="item.image_url" [alt]="" loading="lazy" decoding="async" />
            } @else {
              <span class="subcat-tile__fallback">{{ initials(item.name) }}</span>
            }
          </span>
          <span class="subcat-tile__label">{{ item.name }}</span>
        </a>
      }
    }
  </div>
</section>
