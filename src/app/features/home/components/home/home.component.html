<app-navbar />

<main class="page-content page-content--flush">
  <!-- Visually hidden for SEO/accessibility; does not appear above the banner -->
  <h1 class="seo-only">Best Food Delivery App in Lalganj Ajhara | LalganjEats</h1>

  <nav class="category-tabs" aria-label="Shop categories">
    <div class="container category-tabs__inner" role="tablist">
      @for (cat of categories; track cat.key) {
        <button
          type="button"
          role="tab"
          class="category-tab"
          [class.is-active]="activeCategory() === cat.key"
          [attr.aria-selected]="activeCategory() === cat.key"
          (click)="selectCategory(cat.key)">
          <span class="category-tab__icon" aria-hidden="true">
            @if (cat.key === 'food') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                <path d="M7 2v20"/>
                <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
            }
          </span>
          <span class="category-tab__label">{{ cat.label }}</span>
        </button>
      }
    </div>
  </nav>

  <app-banners [category]="activeCategory()" />
  <app-featured-subcategories layout="desktop" [category]="activeCategory()" />
  @if (activeCategory() === 'food') {
    <app-featured-restaurants [category]="activeCategory()" />
  } @else {
    <app-product-shelves [category]="activeCategory()" />
  }
</main>

<app-cart-conflict-dialog />

<app-instagram-cta />
<app-footer />
@if (activeCategory() === 'grocery') {
  <app-cart-float-bar />
}
