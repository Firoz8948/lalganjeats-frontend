<!-- customer-login.component.html -->
<div class="auth-page">
  <button type="button" class="auth-back" (click)="navigateBack()" aria-label="Go back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    <span>Go back</span>
  </button>

  <div class="auth-card">

    <!-- Logo -->
    <a routerLink="/home" class="auth-logo">
      <img src="assets/images/logo.svg" alt="LalganjEats">
    </a>

    <h1 class="auth-title">Welcome Back!</h1>
    <p class="auth-subtitle">Login to order food from Lalganj's best restaurants</p>

    <!-- Error -->
    @if (error()) {
      <div class="auth-error">⚠️ {{ error() }}</div>
    }

    <!-- Step 1: Phone -->
    @if (step() === 'phone') {
      <div class="auth-form">
        <div class="input-group">
          <span class="input-prefix">+91</span>
          <input
            type="tel"
            maxlength="10"
            placeholder="Enter mobile number"
            [(ngModel)]="phone"
            (keyup.enter)="sendOTP()"
          />
        </div>
        <button class="auth-btn" (click)="sendOTP()" [disabled]="loading()">
          @if (loading()) { Sending… } @else { Send OTP }
        </button>
      </div>
    }

    <!-- Step 2: OTP -->
    @if (step() === 'otp') {
      <div class="auth-form">
        <p class="otp-sent-msg">
          OTP sent to <strong>+91 {{ phone }}</strong>
          <button class="change-link" (click)="goBackToPhone()">Change</button>
        </p>
        <div class="input-group">
          <input
            type="tel"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            [(ngModel)]="otp"
            (keyup.enter)="verifyOTP()"
          />
        </div>
        <label class="legal-consent" [class.legal-consent--sealed]="acceptedLegal">
          <input type="checkbox" [(ngModel)]="acceptedLegal">
          <span class="legal-seal" aria-hidden="true">✓</span>
          <span>
            I accept the
            <a routerLink="/legal/terms" target="_blank">Terms</a>,
            <a routerLink="/legal/privacy" target="_blank">Privacy Policy</a> and
            <a routerLink="/legal/refund" target="_blank">Refund Policy</a>.
          </span>
        </label>
        <button class="auth-btn" (click)="verifyOTP()" [disabled]="loading()">
          @if (loading()) { Verifying… } @else { Verify & Login }
        </button>
        <button class="resend-link" (click)="resendOTP()">Resend OTP</button>
      </div>
    }

  </div>
</div>

<app-bottom-nav />
