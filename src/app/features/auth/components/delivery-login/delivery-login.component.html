<div class="auth-page">
  <div class="auth-card auth-card--partner">

    <div class="auth-badge auth-badge--delivery">🛵 Delivery Partner</div>

    <a routerLink="/" class="auth-logo">
      <img src="assets/images/logo.svg" alt="LalganjEats">
    </a>

    <h1 class="auth-title">Delivery Login</h1>
    <p class="auth-subtitle">Login to accept and deliver orders in Lalganj</p>

    @if (error()) {
      <div class="auth-error">⚠️ {{ error() }}</div>
    }

    @if (step() === 'phone') {
      <div class="auth-form">
        <div class="input-group">
          <span class="input-prefix">+91</span>
          <input
            type="tel"
            maxlength="10"
            placeholder="Your mobile number"
            [(ngModel)]="phone"
            (keyup.enter)="sendOTP()"
          />
        </div>
        <button class="auth-btn" (click)="sendOTP()" [disabled]="loading()">
          @if (loading()) { Sending… } @else { Send OTP }
        </button>
        <p class="auth-hint">
          Ordering food?
          <a routerLink="/auth/login">Customer login</a>
        </p>
      </div>
    }

    @if (step() === 'otp') {
      <div class="auth-form">
        <p class="otp-sent-msg">
          OTP sent to <strong>+91 {{ phone }}</strong>
          <button type="button" class="change-link" (click)="goBack()">Change</button>
        </p>
        <div class="input-group">
          <input
            type="tel"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            [(ngModel)]="otp"
            (keyup.enter)="verifyOTP()"
          />
        </div>
        <button class="auth-btn" (click)="verifyOTP()" [disabled]="loading()">
          @if (loading()) { Verifying… } @else { Verify & Login }
        </button>
        <button type="button" class="resend-link" (click)="resendOTP()">Resend OTP</button>
      </div>
    }

  </div>
</div>
