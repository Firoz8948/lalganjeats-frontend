<div class="login-page">
  
  <img src="assets/images/logo.svg" alt="LalganjEats" class="logo">
  <p class="tagline">Lalganj's Own Food Delivery</p>

  <!-- LOGIN TYPE SELECTION -->
  <div class="login-options">
    
    <a routerLink="/auth/login" class="login-card customer">
      <span class="icon">🍕</span>
      <span class="title">Order Food</span>
      <span class="subtitle">Login as Customer</span>
    </a>

    <a routerLink="/auth/delivery-login" class="login-card delivery">
      <span class="icon">🚴</span>
      <span class="title">Delivery Partner</span>
      <span class="subtitle">Login to deliver orders</span>
    </a>

    <a routerLink="/auth/hotel-login" class="login-card hotel">
      <span class="icon">🏨</span>
      <span class="title">Restaurant Partner</span>
      <span class="subtitle">Manage your restaurant</span>
    </a>

  </div>

</div>
