<div class="auth-page admin-theme">
  <header class="auth-topbar">
    <a routerLink="/" class="auth-topbar__logo">
      <img src="assets/images/logo.svg" alt="LalganjEats">
    </a>
    <span class="auth-topbar__role">Tenant Admin</span>
  </header>

  <div class="auth-card">
    <h1 class="auth-title">Admin Login</h1>
    <p class="auth-subtitle">City operations control panel</p>

    @if (error()) {
      <div class="auth-error">⚠️ {{ error() }}</div>
    }

    <div class="auth-form">
      <div class="input-wrap">
        <label>Username</label>
        <div class="input-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4
                     c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="text" placeholder="admin"
                 [(ngModel)]="username" (keyup.enter)="login()"/>
        </div>
      </div>

      <div class="input-wrap">
        <label>Password</label>
        <div class="input-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="showPwd() ? 'text' : 'password'"
                 placeholder="Enter password"
                 [(ngModel)]="password" (keyup.enter)="login()"/>
          <button type="button" class="toggle-pwd" (click)="togglePassword()">
            {{ showPwd() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button class="auth-btn admin-btn" (click)="login()"
              [disabled]="loading()">
        @if (loading()) { Logging in… } @else { Login to Dashboard }
      </button>
    </div>

    <p class="auth-footer-note">
      Restricted access — Admin only
    </p>
  </div>
</div>
