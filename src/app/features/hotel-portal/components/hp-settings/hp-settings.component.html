<!-- features/hotel-portal/components/hp-settings/hp-settings.component.html -->
<div class="hp-page">

  <app-portal-page-header eyebrow="RESTAURANT PROFILE" title="Restaurant Settings" subtitle="Manage your restaurant information and operating preferences." tone="hotel" />

  @if (loading()) {
    <div class="page-loading">
      <div class="spinner"></div>
      <p>Loading settings…</p>
    </div>
  }

  @if (!loading()) {
    <form class="settings-form" (ngSubmit)="save()">

      <!-- Restaurant Info -->
      <div class="settings-card">
        <h3 class="settings-card__title">Restaurant Information</h3>

        <div class="form-group">
          <label class="form-label">Restaurant Name</label>
          <input
            class="form-input"
            type="text"
            [(ngModel)]="form.restaurant_name"
            name="restaurant_name"
            placeholder="Your restaurant name">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input
            class="form-input"
            type="tel"
            [(ngModel)]="form.phone"
            name="phone"
            placeholder="+91 XXXXX XXXXX">
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea
            class="form-input form-textarea"
            [(ngModel)]="form.address"
            name="address"
            rows="3"
            placeholder="Full restaurant address">
          </textarea>
        </div>
      </div>

      <!-- Delivery Settings -->
      <div class="settings-card">
        <h3 class="settings-card__title">Delivery & Pricing</h3>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Minimum Order (₹)</label>
            <input
              class="form-input"
              type="number"
              [(ngModel)]="form.min_order_amount"
              name="min_order_amount"
              min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Fee (₹)</label>
            <input
              class="form-input"
              type="number"
              [(ngModel)]="form.delivery_fee"
              name="delivery_fee"
              min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Free Delivery Above (₹)</label>
            <input
              class="form-input"
              type="number"
              [(ngModel)]="form.free_delivery_above"
              name="free_delivery_above"
              min="0">
          </div>
        </div>
      </div>

      <!-- Notifications -->
      <div class="settings-card">
        <h3 class="settings-card__title">Notifications</h3>

        <div class="toggle-row">
          <div class="toggle-info">
            <p class="toggle-label">New Order Alerts</p>
            <p class="toggle-desc">Get notified when a new order arrives</p>
          </div>
          <button
            type="button"
            class="toggle-btn"
            [class.on]="form.notif_new_order"
            (click)="form.notif_new_order = !form.notif_new_order">
            <span class="toggle-thumb"></span>
          </button>
        </div>
      </div>

      <!-- Save Button -->
      <div class="form-actions">
        @if (saved()) {
          <span class="saved-msg">
            <app-hp-icon name="check" [size]="15" />
            Settings saved!
          </span>
        }
        <button
          type="submit"
          class="save-btn"
          [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save Changes' }}
        </button>
      </div>

    </form>
  }

</div>
