<!-- features/hotel-portal/components/hp-add-menu-item/hp-add-menu-item.component.html -->
<div class="hp-page">

  <button class="back-btn" (click)="goBack()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Menu
  </button>

  <div class="form-card">
    <h1 class="form-title">Add Menu Item</h1>
    <p class="form-subtitle">Add a new dish to your restaurant menu</p>

    <form (ngSubmit)="submit()">

      <!-- Name -->
      <div class="form-group">
        <label class="form-label">Item Name <span class="required">*</span></label>
        <input
          class="form-input"
          type="text"
          [(ngModel)]="form.name"
          name="name"
          placeholder="e.g. Paneer Butter Masala"
          required>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          class="form-input form-textarea"
          [(ngModel)]="form.description"
          name="description"
          rows="3"
          placeholder="Brief description of the dish">
        </textarea>
      </div>

      <!-- Price Row -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Price (₹) <span class="required">*</span></label>
          <input
            class="form-input"
            type="number"
            [(ngModel)]="form.price"
            name="price"
            min="0"
            placeholder="0"
            required>
        </div>
        <div class="form-group">
          <label class="form-label">Original Price (₹)</label>
          <input
            class="form-input"
            type="number"
            [(ngModel)]="form.original_price"
            name="original_price"
            min="0"
            placeholder="For strikethrough">
        </div>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label class="form-label">Category</label>
        <select
          class="form-input form-select"
          [(ngModel)]="form.category_id"
          name="category_id">
          <option [ngValue]="null">— Uncategorized —</option>
          @for (cat of categories(); track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <!-- Flags -->
      <div class="flags-row">
        <label class="flag-option" [class.active]="form.is_veg">
          <input
            type="checkbox"
            [(ngModel)]="form.is_veg"
            name="is_veg">
          <span class="flag-dot veg"></span>
          Vegetarian
        </label>

        <label class="flag-option" [class.active]="form.is_bestseller">
          <input
            type="checkbox"
            [(ngModel)]="form.is_bestseller"
            name="is_bestseller">
          <app-hp-icon name="star" [size]="14" />
          Bestseller
        </label>

        <label class="flag-option" [class.active]="form.is_available">
          <input
            type="checkbox"
            [(ngModel)]="form.is_available"
            name="is_available">
          <app-hp-icon name="check" [size]="14" />
          Available Now
        </label>
      </div>

      <!-- Error -->
      @if (error()) {
        <div class="error-msg">
          <app-hp-icon name="alert" [size]="16" />
          {{ error() }}
        </div>
      }

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="goBack()">
          Cancel
        </button>
        <button type="submit" class="submit-btn" [disabled]="saving()">
          {{ saving() ? 'Adding…' : '+ Add to Menu' }}
        </button>
      </div>

    </form>
  </div>

</div>
