@if (count() > 0) {
  <div class="cart-float__spacer" aria-hidden="true"></div>
  <a class="cart-float" routerLink="/checkout" aria-label="View cart">
    <span class="cart-float__icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <b>{{ count() }}</b>
    </span>
    <span class="cart-float__text">
      <strong>{{ label() }}</strong>
      <small>₹{{ total() }}</small>
    </span>
    <span class="cart-float__cta">
      View cart
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </span>
  </a>
}
